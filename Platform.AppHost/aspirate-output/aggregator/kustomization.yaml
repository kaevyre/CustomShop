resources:
- deployment.yaml
- service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: aggregator-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - HTTP_PORTS=8080
    - services__orders-api__grpc__0=orders-api:5180
    - services__orders-api__http__0=http://orders-api:5080
    - services__catalog-api__grpc__0=catalog-api:5181
    - services__catalog-api__http__0=http://catalog-api:5081
    - services__reviews-api__grpc__0=reviews-api:5182
    - services__reviews-api__http__0=http://reviews-api:5082
    - IdentityServer__Authority=http://localhost:5300
    - services__keycloak__http__0=http://keycloak:8080
    - services__keycloak__management__0=keycloak:9000
    - Jwt__SecretKey=dev-only-super-secret-key-change-me-0123456789-abcdef
    - Jwt__Issuer=auth-service
    - Jwt__Audience=microservices-platform
    - Keycloak__Realm=DevRealmDrivers
    - Keycloak__PublicUrl=http://localhost:8080
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    - OTEL_SERVICE_NAME=aggregator
    - ASPNETCORE_URLS=http://+:8080;

secretGenerator:
- name: aggregator-secrets
  envs:
  - .aggregator.secrets

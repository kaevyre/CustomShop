apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
      - name: gateway
        image: gateway:v1
        imagePullPolicy: IfNotPresent
        ports:
        - { name: http, containerPort: 8080 }
        envFrom:
        - configMapRef:
            name: gateway-config
        - secretRef:
            name: gateway-secrets              # Jwt__SecretKey (ключ підпису JWT, Лаб. 09)
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits:   { memory: 384Mi }
        startupProbe:
          httpGet: { path: /health/startup, port: 8080 }
          periodSeconds: 3
          failureThreshold: 20
        livenessProbe:
          httpGet: { path: /health/live, port: 8080 }
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /health/ready, port: 8080 }
          periodSeconds: 10
